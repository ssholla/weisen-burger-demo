<template>
    <div class="construction-projects-results">
        <div class="results-hero">
            <div class="results-hero-inner">
                <div class="results-count">
                    {resultCount} {resultLabel}
                </div>

                <div class="header-pagination" if:true={hasProjects}>
                    <!-- <div class="pagination-info">{showingStartIndex}–{showingEndIndex} of {resultCount}</div> -->
                    <div class="pagination-buttons">
                        <button class="nav-button prev" onclick={handlePreviousPage} disabled={isFirstPage} aria-label="Previous page">‹</button>
                        <template for:each={pages} for:item="p">
                            <button key={p.num} class={p.className} data-page={p.num} onclick={handleGoToPage} aria-label={p.num}>{p.num}</button>
                        </template>
                        <button class="nav-button next" onclick={handleNextPage} disabled={isLastPage} aria-label="Next page">›</button>
                    </div>
                </div>

                <div class="sort-dropdown">
                    <div class="filter-item">
                        <label class="filter-label">Sort By</label>
                        <lightning-combobox
                            name="sort"
                            placeholder="Default"
                            options={sortOptions}
                            value={selectedSort}
                            onchange={handleSortChange}
                            variant="label-hidden"
                            class="filter-input">
                        </lightning-combobox>
                    </div>
                </div>
            </div>
        </div>

        <div class="projects-container">
            <template if:true={hasProjects}>
                <div class={projectsGridClass}>
                    <template for:each={paginatedProjects} for:item="project">
                        <div key={project.id} class="project-card">
                            <!-- Image Carousel -->
                            <div class="carousel-container">
                                <template if:true={project.hasMultipleImages}>
                                    <lightning-button-icon
                                        icon-name="utility:chevronleft"
                                        alternative-text="Previous Image"
                                        variant="bare"
                                        class="carousel-nav nav-prev"
                                        data-project-id={project.id}
                                        onclick={handlePreviousImage}>
                                    </lightning-button-icon>
                                </template>

                                <div class="image-wrapper">
                                    <img 
                                        src={project.currentImage} 
                                        alt={project.title}
                                        class="project-image"
                                    />
                                    <div class="image-badge">{project.code}</div>
                                </div>

                                <template if:true={project.hasMultipleImages}>
                                    <lightning-button-icon
                                        icon-name="utility:chevronright"
                                        alternative-text="Next Image"
                                        variant="bare"
                                        class="carousel-nav nav-next"
                                        data-project-id={project.id}
                                        onclick={handleNextImage}>
                                    </lightning-button-icon>
                                </template>

                                <!-- Image Indicators -->
                                <template if:true={project.hasMultipleImages}>
                                    <div class="carousel-indicators">
                                        <template for:each={project.imageIndicators} for:item="indicator">
                                            <span 
                                                key={indicator.index} 
                                                class={indicator.className}
                                                data-project-id={project.id}
                                                data-index={indicator.index}
                                                onclick={handleIndicatorClick}>
                                            </span>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Project Info -->
                            <div class="project-info">
                                <div class="project-location">
                                    {project.location}, {project.region}
                                </div>
                                <h3 class="project-title">{project.title}</h3>
                                
                                <div class="project-details">
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:layers" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.rooms} Rooms</span>
                                    </div>
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:salesforce1" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.area} m²</span>
                                    </div>
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:home" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.propertyType}</span>
                                    </div>
                                </div>

                                <div class="project-features">
                                    <template for:each={project.features} for:item="feature">
                                        <span key={feature} class="feature-tag">{feature}</span>
                                    </template>
                                </div>

                                <div class="project-footer">
                                    <div class="project-price">{project.formattedPrice}</div>
                                    <button
                                        class="view-button"
                                        data-project-id={project.id}
                                        onclick={handleViewDetails}>
                                        View Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Footer Pagination (duplicate of header pagination, placed under results) -->
                <div class="footer-pagination" if:true={hasProjects}>
                    <div class="pagination-buttons">
                        <button class="nav-button prev" onclick={handlePreviousPage} disabled={isFirstPage} aria-label="Previous page">‹</button>
                        <template for:each={pages} for:item="p">
                            <button key={p.num} class={p.className} data-page={p.num} onclick={handleGoToPage} aria-label={p.num}>{p.num}</button>
                        </template>
                        <button class="nav-button next" onclick={handleNextPage} disabled={isLastPage} aria-label="Next page">›</button>
                    </div>
                </div>
            </template>
            <template if:false={hasProjects}>
                <div class="slds-p-around_medium slds-text-align_center slds-text-heading_medium">
                    No projects match your criteria.
                </div>
            </template>
        </div>

        <!-- Project Detail Modal -->
        <template if:true={showDetailModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container detail-modal-container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseDetail}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-modal__title detail-location">{selectedProject.location}, {selectedProject.region}</h2>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content detail-modal-body">
                        <div class="detail-container">
                            <!-- Left Column: Image and Info -->
                            <div class="detail-left">
                                <!-- Status Badges -->
                                <div class="status-badges">
                                    <span class="status-badge available">On Sale</span>
                                    <span class="status-badge ready">Ready for Occupancy Now</span>
                                </div>

                                <!-- Title -->
                                <h1 class="detail-title">{selectedProject.title}</h1>
                                <div class="detail-price">{selectedProject.formattedPrice}</div>

                                <!-- Property Details Table -->
                                <div class="details-table">
                                    <div class="detail-row">
                                        <span class="detail-label">Property</span>
                                        <span class="detail-value">{selectedProject.code}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Number of Rooms</span>
                                        <span class="detail-value">{selectedProject.rooms}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Living Area</span>
                                        <span class="detail-value">{selectedProject.area} m²</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Floor</span>
                                        <span class="detail-value">{selectedProject.floor}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Net Purchase Price</span>
                                        <span class="detail-value">{selectedProject.formattedPrice} EUR</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Number of Bathrooms</span>
                                        <span class="detail-value">{selectedProject.bathrooms}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Parking Space</span>
                                        <span class="detail-value">{selectedProject.parkingPrice}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Price per Square Meter</span>
                                        <span class="detail-value">{selectedProject.pricePerSqm}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Column: Image Carousel -->
                            <div class="detail-right">
                                <div class="detail-carousel-container">
                                    <template if:true={selectedProject.hasMultipleImages}>
                                        <lightning-button-icon
                                            icon-name="utility:chevronleft"
                                            alternative-text="Previous Image"
                                            variant="bare"
                                            class="detail-carousel-nav detail-nav-prev"
                                            onclick={handleDetailPreviousImage}>
                                        </lightning-button-icon>
                                    </template>

                                    <div class="detail-image-wrapper">
                                        <img 
                                            src={selectedProject.currentImage} 
                                            alt={selectedProject.title}
                                            class="detail-project-image"
                                        />
                                    </div>

                                    <template if:true={selectedProject.hasMultipleImages}>
                                        <lightning-button-icon
                                            icon-name="utility:chevronright"
                                            alternative-text="Next Image"
                                            variant="bare"
                                            class="detail-carousel-nav detail-nav-next"
                                            onclick={handleDetailNextImage}>
                                        </lightning-button-icon>
                                    </template>

                                    <!-- Image Indicators -->
                                    <template if:true={selectedProject.hasMultipleImages}>
                                        <div class="detail-carousel-indicators">
                                            <template for:each={selectedProject.imageIndicators} for:item="indicator">
                                                <span 
                                                    key={indicator.index} 
                                                    class={indicator.className}
                                                    data-index={indicator.index}
                                                    onclick={handleDetailIndicatorClick}>
                                                </span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="detail-modal-footer">

                        <template if:true={isInternal}>
                        <button class="custom-download-button" onclick={handleOpenRecordToSalesforce}>Open record to Salesforce</button>
                        </template>


                        <template if:false={isInternal}>
                        <button class="custom-register-button" onclick={handleOpenRegister}>Register a deal</button>
                        </template>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <!-- Register Lead Modal -->
        <template if:true={showRegisterModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container detail-modal-container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseRegister}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-modal__title detail-location">Register Interest</h2>
                    </header>

                    <div class="slds-modal__content detail-modal-body">
                        <div class="register-form-container">
                            <div class="register-header-text">
                                <h1 class="detail-title">Interested in {selectedProject.title}?</h1>
                                <p class="project-location">Fill in your details below and we will contact you shortly.</p>
                            </div>

                            <div class="register-fields-grid">
                                <lightning-input label="First Name" value={registerFirstName} onchange={handleRegisterInput} data-name="firstName" class="register-input"></lightning-input>
                                <lightning-input label="Last Name" value={registerLastName} onchange={handleRegisterInput} data-name="lastName" class="register-input" required></lightning-input>
                                <lightning-input label="Email" type="email" value={registerEmail} onchange={handleRegisterInput} data-name="email" class="register-input"></lightning-input>
                                <lightning-input label="Phone" type="tel" value={registerPhone} onchange={handleRegisterInput} data-name="phone" class="register-input"></lightning-input>
                                <lightning-input label="Mobile" type="tel" value={registerMobile} onchange={handleRegisterInput} data-name="mobile" class="register-input"></lightning-input>
                            </div>
                        </div>
                    </div>

                    <footer class="detail-modal-footer">
                        <button class="custom-contact-button" onclick={handleCloseRegister}>Cancel</button>
                        <button class="custom-register-button" onclick={handleSubmitRegister}>Submit Registration</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
