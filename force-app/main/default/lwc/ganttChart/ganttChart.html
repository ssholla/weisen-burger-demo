<template>
    <div class="gantt-wrapper">
        <template if:true={isReady}>
        <!-- Controls -->
        <div class="slds-grid slds-gutters slds-p-around_medium gantt-section">
            <div class="slds-col">
                <h1 class="slds-text-heading_medium title-text">Construction Project Management</h1>
            </div>
            <div class="slds-col slds-grow-none">
                <lightning-input class="date-input" type="month" label="Start" value={startDateString} onchange={handleStartDateChange} variant="label-hidden"></lightning-input>
            </div>
            <div class="slds-col slds-grow-none">
                <lightning-input class="date-input" type="month" label="End" value={endDateString} onchange={handleEndDateChange} variant="label-hidden"></lightning-input>
            </div>
        </div>
        
        <div class="gantt-container gantt-section" style="overflow-x: auto; overflow-y: hidden;" onmousemove={handleMouseMove} onmouseleave={hideTooltip}>
            
                <template if:true={tooltip.visible}>
                    <div class="glassy-tooltip" style={tooltipStyle}>
                        <div class="tooltip-title">{tooltip.title}</div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Status:</span>
                            <span>{tooltip.status}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Start:</span>
                            <span>{tooltip.start}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">End:</span>
                            <span>{tooltip.end}</span>
                        </div>
                        <div class="tooltip-row">
                            <span class="tooltip-label">Owner:</span>
                            <span>{tooltip.owner}</span>
                        </div>
                    </div>
                </template>
                
                <template if:true={hasRows}>
                    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" width={totalWidth} height={totalHeight} class="gantt-svg">
                        
                        <!-- 1. AXIS HEADER -->
                        <defs>
                            <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" style="stop-color:#163f5f;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#0d2f4e;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        
                        <!-- Background Header -->
                        <rect x="0" y="0" width="100%" height="60" fill="url(#headerGrad)"></rect>
                        
                        <!-- Sidebar Header Title -->
                        <!-- Centered in 200px sidebar -->
                        <text x="100" y="25" class="title-text" fill="white" text-anchor="middle">
                            <tspan x="100" dy="0">PROJECT</tspan>
                            <tspan x="100" dy="20">MANAGEMENT</tspan>
                        </text>
                        <line x1={sidebarWidth} y1="0" x2={sidebarWidth} y2={totalHeight} stroke="#2c5c85" stroke-width="2"></line>

                        <!-- Month Ticks -->
                        <template for:each={axisMonths} for:item="month">
                            <g key={month.key}>
                                <text x={month.center} y="20" text-anchor="middle" class="axis-text">{month.label}</text>
                                <!-- Grid Line for Month -->
                                <line x1={month.x} y1="0" x2={month.x} y2={totalHeight} class="axis-line"></line>
                            </g>
                        </template>

                        <!-- Week Ticks -->
                        <template for:each={axisWeeks} for:item="week">
                            <g key={week.key}>
                                <text x={week.x} dx="0" text-anchor="middle" y="45" class="axis-text-week">{week.label}</text>
                            </g>
                        </template>
                        
                        <!-- Horizontal Separator below Week -->
                        <line x1="0" y1="60" x2="100%" y2="60" class="axis-line"></line>

                        <!-- 2. DATA ROWS -->
                        <template for:each={rows} for:item="row">
                            <g key={row.id}>
                                <!-- ROW Grid Line (Horizontal) -->
                                <template if:true={row.isPhase}>
                                    <line x1="0" y1={row.y} x2="100%" y2={row.y} stroke="#1c4566" stroke-width="1"></line>
                                </template>

                                <!-- SIDEBAR TEXT -->
                                <!-- If Phase -->
                                <template if:true={row.isPhase}>
                                    <text x="50" y={row.y} dy="18" class="sidebar-text-phase" text-anchor="end" style="text-anchor: end; transform: translateX(80px);">{row.name}</text>
                                </template>
                                <!-- If Task -->
                                <template if:true={row.isTask}>
                                    <text x="60" y={row.y} dy="18" class="sidebar-text-task" style="text-anchor: end; transform: translateX(80px);">{row.name}</text>
                                </template>

                                <!-- CONNECTOR LINES -->
                                <template if:true={row.connector}>
                                    <path d={row.connector} stroke={row.connectorColor} fill="none" stroke-width="1.5"></path>
                                </template>

                                <!-- BARS -->
                                <!-- Added onmouseleave explicitly to the rect -->
                                <rect 
                                    x={row.barX} 
                                    y={row.barY} 
                                    width={row.barW} 
                                    height={row.barH} 
                                    rx={row.rx}
                                    fill={row.color}
                                    data-id={row.id}
                                    onmouseenter={handleBarHover}
                                    onmouseleave={hideTooltip} 
                                >
                                </rect>
                                
                                <!-- Extra Label (e.g. Owner on Top of Bar) -->
                                <text x={row.barX} y={row.barY} dy="-5" font-size="10" fill="white">{row.owner}</text>
                            </g>
                        </template>
                    </svg>
                </template>
                
                <template if:false={hasRows}>
                    <div class="slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-color_inverse">No Phases found in the selected timeframe.</p>
                    </div>
                </template>
            </div>
        </template>

        <template if:false={isReady}>
            <div class="slds-p-around_medium slds-text-align_center">
                <h2 class="slds-text-heading_small slds-text-color_error">No Project Record ID Found</h2>
                <p>Please open this component on a KS_Project__c Record Page.</p>
            </div>
        </template>
    </div>
</template>
