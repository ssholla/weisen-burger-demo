<template>
    <div class="construction-projects">

        <!-- Filters Section -->
        <div class="filters-container">
            <h2 class="filters-title">Filter Results</h2>
            <div class="filters-grid">
                <!-- Price Filter -->
                <div class="filter-item">
                    <label class="filter-label">Price</label>
                    <lightning-combobox
                        name="price"
                        placeholder="Select Price Range"
                        options={priceOptions}
                        value={selectedPrice}
                        onchange={handlePriceChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Rooms Filter -->
                <div class="filter-item">
                    <label class="filter-label">Rooms</label>
                    <lightning-combobox
                        name="rooms"
                        placeholder="Select Number of Rooms"
                        options={roomOptions}
                        value={selectedRooms}
                        onchange={handleRoomsChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Bathrooms Filter -->
                <div class="filter-item">
                    <label class="filter-label">Bathrooms</label>
                    <lightning-combobox
                        name="bathrooms"
                        placeholder="Select Number of Bathrooms"
                        options={bathroomOptions}
                        value={selectedBathrooms}
                        onchange={handleBathroomsChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Location Filter -->
                <div class="filter-item">
                    <label class="filter-label">Location</label>
                    <lightning-combobox
                        name="location"
                        placeholder="Select Location"
                        options={locationOptions}
                        value={selectedLocation}
                        onchange={handleLocationChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Region Filter -->
                <div class="filter-item">
                    <label class="filter-label">Region</label>
                    <lightning-combobox
                        name="region"
                        placeholder="Select Region"
                        options={regionOptions}
                        value={selectedRegion}
                        onchange={handleRegionChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Property Type Filter -->
                <div class="filter-item">
                    <label class="filter-label">Property Type</label>
                    <lightning-combobox
                        name="propertyType"
                        placeholder="Select Property Type"
                        options={propertyTypeOptions}
                        value={selectedPropertyType}
                        onchange={handlePropertyTypeChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>
            </div>

            <!-- Sort Filter (Below main filters) -->
            <div class="sort-container">
                <div class="filter-item">
                    <label class="filter-label">Sort</label>
                    <lightning-combobox
                        name="sort"
                        placeholder="Sort"
                        options={sortOptions}
                        value={selectedSort}
                        onchange={handleSortChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>
            </div>

            <!-- Filter Actions -->
            <div class="filter-actions">
                <button
                    onclick={handleClearFilters}
                    class="clear-button">
                    Clear Filters
                </button>
                <div class="results-count">
                    {resultCount} {resultLabel}
                </div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div class="projects-container">
            <template if:true={hasProjects}>
                <div class={projectsGridClass}>
                    <template for:each={filteredProjects} for:item="project">
                        <div key={project.id} class="project-card">
                            <!-- Image Carousel -->
                            <div class="carousel-container">
                                <template if:true={project.hasMultipleImages}>
                                    <lightning-button-icon
                                        icon-name="utility:chevronleft"
                                        alternative-text="Previous Image"
                                        variant="bare"
                                        class="carousel-nav nav-prev"
                                        data-project-id={project.id}
                                        onclick={handlePreviousImage}>
                                    </lightning-button-icon>
                                </template>

                                <div class="image-wrapper">
                                    <img 
                                        src={project.currentImage} 
                                        alt={project.title}
                                        class="project-image"
                                    />
                                    <div class="image-badge">{project.code}</div>
                                </div>

                                <template if:true={project.hasMultipleImages}>
                                    <lightning-button-icon
                                        icon-name="utility:chevronright"
                                        alternative-text="Next Image"
                                        variant="bare"
                                        class="carousel-nav nav-next"
                                        data-project-id={project.id}
                                        onclick={handleNextImage}>
                                    </lightning-button-icon>
                                </template>

                                <!-- Image Indicators -->
                                <template if:true={project.hasMultipleImages}>
                                    <div class="carousel-indicators">
                                        <template for:each={project.imageIndicators} for:item="indicator">
                                            <span 
                                                key={indicator.index} 
                                                class={indicator.className}
                                                data-project-id={project.id}
                                                data-index={indicator.index}
                                                onclick={handleIndicatorClick}>
                                            </span>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Project Info -->
                            <div class="project-info">
                                <div class="project-location">
                                    {project.location}, {project.region}
                                </div>
                                <h3 class="project-title">{project.title}</h3>
                                
                                <div class="project-details">
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:layers" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.rooms} Rooms</span>
                                    </div>
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:salesforce1" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.area} m²</span>
                                    </div>
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:home" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.propertyType}</span>
                                    </div>
                                </div>

                                <div class="project-features">
                                    <template for:each={project.features} for:item="feature">
                                        <span key={feature} class="feature-tag">{feature}</span>
                                    </template>
                                </div>

                                <div class="project-footer">
                                    <div class="project-price">{project.formattedPrice}</div>
                                    <button
                                        class="view-button"
                                        data-project-id={project.id}
                                        onclick={handleViewDetails}>
                                        View Details
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- No Results Message -->
            <template if:false={hasProjects}>
                <div class="no-results">
                    <lightning-icon 
                        icon-name="utility:search" 
                        size="large"
                        class="no-results-icon">
                    </lightning-icon>
                    <h3>No projects found</h3>
                    <p>Try adjusting your filters to see more results</p>
                </div>
            </template>
        </div>

        <!-- Project Detail Modal -->
        <template if:true={showDetailModal}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container detail-modal-container">
                    <!-- Modal Header -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseDetail}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-modal__title detail-location">{selectedProject.location}, {selectedProject.region}</h2>
                    </header>

                    <!-- Modal Body -->
                    <div class="slds-modal__content detail-modal-body">
                        <div class="detail-container">
                            <!-- Left Column: Image and Info -->
                            <div class="detail-left">
                                <!-- Status Badges -->
                                <div class="status-badges">
                                    <span class="status-badge available">On Sale</span>
                                    <span class="status-badge ready">Ready for Occupancy Now</span>
                                </div>

                                <!-- Title -->
                                <h1 class="detail-title">{selectedProject.title}</h1>
                                <div class="detail-price">{selectedProject.formattedPrice}</div>

                                <!-- Property Details Table -->
                                <div class="details-table">
                                    <div class="detail-row">
                                        <span class="detail-label">Property</span>
                                        <span class="detail-value">{selectedProject.code}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Number of Rooms</span>
                                        <span class="detail-value">{selectedProject.rooms}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Living Area</span>
                                        <span class="detail-value">{selectedProject.area} m²</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Floor</span>
                                        <span class="detail-value">{selectedProject.floor}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Net Purchase Price</span>
                                        <span class="detail-value">{selectedProject.formattedPrice} EUR</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Number of Bathrooms</span>
                                        <span class="detail-value">{selectedProject.bathrooms}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Parking Space</span>
                                        <span class="detail-value">{selectedProject.parkingPrice}</span>
                                    </div>
                                    <div class="detail-row">
                                        <span class="detail-label">Price per Square Meter</span>
                                        <span class="detail-value">{selectedProject.pricePerSqm}</span>
                                    </div>
                                </div>

                                <!-- Action Buttons (moved to footer) -->
                                <!-- ...existing code... -->
                            </div>

                            <!-- Right Column: Image Carousel -->
                            <div class="detail-right">
                                <div class="detail-carousel-container">
                                    <template if:true={selectedProject.hasMultipleImages}>
                                        <lightning-button-icon
                                            icon-name="utility:chevronleft"
                                            alternative-text="Previous Image"
                                            variant="bare"
                                            class="detail-carousel-nav detail-nav-prev"
                                            onclick={handleDetailPreviousImage}>
                                        </lightning-button-icon>
                                    </template>

                                    <div class="detail-image-wrapper">
                                        <img 
                                            src={selectedProject.currentImage} 
                                            alt={selectedProject.title}
                                            class="detail-project-image"
                                        />
                                    </div>

                                    <template if:true={selectedProject.hasMultipleImages}>
                                        <lightning-button-icon
                                            icon-name="utility:chevronright"
                                            alternative-text="Next Image"
                                            variant="bare"
                                            class="detail-carousel-nav detail-nav-next"
                                            onclick={handleDetailNextImage}>
                                        </lightning-button-icon>
                                    </template>

                                    <!-- Image Indicators -->
                                    <template if:true={selectedProject.hasMultipleImages}>
                                        <div class="detail-carousel-indicators">
                                            <template for:each={selectedProject.imageIndicators} for:item="indicator">
                                                <span 
                                                    key={indicator.index} 
                                                    class={indicator.className}
                                                    data-index={indicator.index}
                                                    onclick={handleDetailIndicatorClick}>
                                                </span>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Footer -->
                    <footer class="detail-modal-footer">
                        <button class="custom-download-button" onclick={handleDownloadExpose}>Download Exposé</button>
                        <button class="custom-contact-button" onclick={handleContactFromDetail}>Contact Us</button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
