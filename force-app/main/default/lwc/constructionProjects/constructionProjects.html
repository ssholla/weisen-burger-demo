<template>
    <div class="construction-projects">
        <!-- Header Section -->
        <div class="header-section">
            <h1 class="main-title">Construction Projects</h1>
            <p class="subtitle">Discover your future home in our premium construction projects</p>
        </div>

        <!-- Filters Section -->
        <div class="filters-container">
            <h2 class="filters-title">Filter Results</h2>
            <div class="filters-grid">
                <!-- Price Filter -->
                <div class="filter-item">
                    <label class="filter-label">Price</label>
                    <lightning-combobox
                        name="price"
                        placeholder="Select Price Range"
                        options={priceOptions}
                        value={selectedPrice}
                        onchange={handlePriceChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Rooms Filter -->
                <div class="filter-item">
                    <label class="filter-label">Rooms</label>
                    <lightning-combobox
                        name="rooms"
                        placeholder="Select Number of Rooms"
                        options={roomOptions}
                        value={selectedRooms}
                        onchange={handleRoomsChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Bathrooms Filter -->
                <div class="filter-item">
                    <label class="filter-label">Bathrooms</label>
                    <lightning-combobox
                        name="bathrooms"
                        placeholder="Select Number of Bathrooms"
                        options={bathroomOptions}
                        value={selectedBathrooms}
                        onchange={handleBathroomsChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Location Filter -->
                <div class="filter-item">
                    <label class="filter-label">Location</label>
                    <lightning-combobox
                        name="location"
                        placeholder="Select Location"
                        options={locationOptions}
                        value={selectedLocation}
                        onchange={handleLocationChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Region Filter -->
                <div class="filter-item">
                    <label class="filter-label">Region</label>
                    <lightning-combobox
                        name="region"
                        placeholder="Select Region"
                        options={regionOptions}
                        value={selectedRegion}
                        onchange={handleRegionChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>

                <!-- Property Type Filter -->
                <div class="filter-item">
                    <label class="filter-label">Property Type</label>
                    <lightning-combobox
                        name="propertyType"
                        placeholder="Select Property Type"
                        options={propertyTypeOptions}
                        value={selectedPropertyType}
                        onchange={handlePropertyTypeChange}
                        variant="label-hidden"
                        class="filter-input">
                    </lightning-combobox>
                </div>
            </div>

            <!-- Filter Actions -->
            <div class="filter-actions">
                <lightning-button
                    label="Clear Filters"
                    onclick={handleClearFilters}
                    variant="neutral"
                    class="clear-button">
                </lightning-button>
                <div class="results-count">
                    {resultCount} {resultLabel}
                </div>
            </div>
        </div>

        <!-- Projects Grid -->
        <div class="projects-container">
            <template if:true={hasProjects}>
                <div class="projects-grid">
                    <template for:each={filteredProjects} for:item="project">
                        <div key={project.id} class="project-card">
                            <!-- Image Carousel -->
                            <div class="carousel-container">
                                <template if:true={project.hasMultipleImages}>
                                    <lightning-button-icon
                                        icon-name="utility:chevronleft"
                                        alternative-text="Previous Image"
                                        variant="bare"
                                        class="carousel-nav nav-prev"
                                        data-project-id={project.id}
                                        onclick={handlePreviousImage}>
                                    </lightning-button-icon>
                                </template>

                                <div class="image-wrapper">
                                    <img 
                                        src={project.currentImage} 
                                        alt={project.title}
                                        class="project-image"
                                    />
                                    <div class="image-badge">{project.code}</div>
                                </div>

                                <template if:true={project.hasMultipleImages}>
                                    <lightning-button-icon
                                        icon-name="utility:chevronright"
                                        alternative-text="Next Image"
                                        variant="bare"
                                        class="carousel-nav nav-next"
                                        data-project-id={project.id}
                                        onclick={handleNextImage}>
                                    </lightning-button-icon>
                                </template>

                                <!-- Image Indicators -->
                                <template if:true={project.hasMultipleImages}>
                                    <div class="carousel-indicators">
                                        <template for:each={project.imageIndicators} for:item="indicator">
                                            <span 
                                                key={indicator.index} 
                                                class={indicator.className}
                                                data-project-id={project.id}
                                                data-index={indicator.index}
                                                onclick={handleIndicatorClick}>
                                            </span>
                                        </template>
                                    </div>
                                </template>
                            </div>

                            <!-- Project Info -->
                            <div class="project-info">
                                <div class="project-location">
                                    {project.location}, {project.region}
                                </div>
                                <h3 class="project-title">{project.title}</h3>
                                
                                <div class="project-details">
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:layers" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.rooms} Rooms</span>
                                    </div>
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:salesforce1" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.area} m²</span>
                                    </div>
                                    <div class="detail-item">
                                        <lightning-icon 
                                            icon-name="utility:home" 
                                            size="x-small"
                                            class="detail-icon">
                                        </lightning-icon>
                                        <span>{project.propertyType}</span>
                                    </div>
                                </div>

                                <div class="project-features">
                                    <template for:each={project.features} for:item="feature">
                                        <span key={feature} class="feature-tag">{feature}</span>
                                    </template>
                                </div>

                                <div class="project-footer">
                                    <div class="project-price">{project.formattedPrice}</div>
                                    <lightning-button
                                        label="View Details"
                                        variant="brand"
                                        class="view-button"
                                        data-project-id={project.id}
                                        onclick={handleViewDetails}>
                                    </lightning-button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- No Results Message -->
            <template if:false={hasProjects}>
                <div class="no-results">
                    <lightning-icon 
                        icon-name="utility:search" 
                        size="large"
                        class="no-results-icon">
                    </lightning-icon>
                    <h3>No projects found</h3>
                    <p>Try adjusting your filters to see more results</p>
                </div>
            </template>
        </div>

        <!-- Contact Section -->
        <div class="contact-section">
            <h2 class="contact-title">Schedule a Viewing</h2>
            <p class="contact-subtitle">We're happy to provide you with personal information</p>
            <lightning-button
                label="Contact Us"
                variant="brand"
                class="contact-button"
                onclick={handleContactClick}>
            </lightning-button>
        </div>
    </div>
</template>
