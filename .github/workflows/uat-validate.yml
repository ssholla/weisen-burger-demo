name: Validate to UAT Environment

on:
  pull_request:
    branches: [uat]
    types: [opened, synchronize, reopened]
    paths:
      - "force-app/**"

jobs:
  validate-to-uat:
    uses: ./.github/workflows/action-validate.yml
    with:
      environment: uat
      user-map-for-deployments: false
      skip-rules: true
    secrets: inherit

    permissions:
      actions: read
      security-events: write
      contents: read
      issues: write
      pull-requests: write
